name: Rust CI

on:
  push:
    branches: [ main ] # Standard default branch
  pull_request:
    branches: [ main ] # Standard default branch

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy Lints
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build (debug)
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  # Optional: Add a build for release profile separately if needed,
  # but tests usually run on debug builds. Release build is covered in release workflow.
  # build_release_profile:
  # ... (content for release build if added later)
